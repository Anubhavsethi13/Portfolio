<svg viewBox="0 0 64 64" width="64" height="64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="projBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#60A5FA" />
      <stop offset="50%" stopColor="#2563EB" />
      <stop offset="100%" stopColor="#1D4ED8" />
    </linearGradient>
    <linearGradient id="projGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" stopOpacity="0.32" />
      <stop offset="40%" stopColor="#FFFFFF" stopOpacity="0.08" />
      <stop offset="100%" stopColor="#000000" stopOpacity="0.12" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#1E293B" />
      <stop offset="100%" stopColor="#0B1120" />
    </linearGradient>
    <linearGradient id="bracketCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38BDF8" />
      <stop offset="100%" stopColor="#06B6D4" />
    </linearGradient>
    <filter id="projShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" floodColor="#000000" floodOpacity="0.32" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#projBg)" stroke="rgba(255,255,255,0.25)" strokeWidth="1" filter="url(#projShadow)" />
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#projGloss)" />

  <!-- Code Display Monitor -->
  <rect x="11" y="12" width="42" height="30" rx="4" fill="url(#screenGrad)" stroke="rgba(255,255,255,0.18)" strokeWidth="1" />
  
  <!-- Window Traffic Lights -->
  <circle cx="16" cy="16.5" r="1.5" fill="#EF4444" />
  <circle cx="20.5" cy="16.5" r="1.5" fill="#F59E0B" />
  <circle cx="25" cy="16.5" r="1.5" fill="#10B981" />

  <!-- Code Brackets & Slash -->
  <path d="M 22,23 L 17,27 L 22,31" fill="none" stroke="url(#bracketCyan)" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" />
  <path d="M 42,23 L 47,27 L 42,31" fill="none" stroke="url(#bracketCyan)" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" />
  <line x1="34" y1="21" x2="30" y2="33" stroke="#A5F3FC" strokeWidth="2" strokeLinecap="round" />

  <!-- Metallic Stand -->
  <path d="M 28,42 L 36,42 L 38,48 L 26,48 Z" fill="#94A3B8" opacity="0.9" />
  <rect x="22" y="48" width="20" height="3" rx="1.5" fill="#E2E8F0" />
</svg>
