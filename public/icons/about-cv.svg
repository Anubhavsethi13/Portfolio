<svg viewBox="0 0 64 64" width="64" height="64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="aboutBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FBBF24" />
      <stop offset="50%" stopColor="#F59E0B" />
      <stop offset="100%" stopColor="#D97706" />
    </linearGradient>
    <linearGradient id="aboutGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" stopOpacity="0.3" />
      <stop offset="40%" stopColor="#FFFFFF" stopOpacity="0.08" />
      <stop offset="100%" stopColor="#000000" stopOpacity="0.1" />
    </linearGradient>
    <linearGradient id="paperBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="100%" stopColor="#F1F5F9" />
    </linearGradient>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#06B6D4" />
      <stop offset="100%" stopColor="#0D9488" />
    </linearGradient>
    <filter id="aboutShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" floodColor="#000000" floodOpacity="0.32" />
    </filter>
    <filter id="innerDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" floodColor="#000000" floodOpacity="0.18" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#aboutBg)" stroke="rgba(255,255,255,0.25)" strokeWidth="1" filter="url(#aboutShadow)" />
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#aboutGloss)" />

  <!-- Document Card -->
  <rect x="13" y="12" width="38" height="40" rx="4" fill="url(#paperBg)" filter="url(#innerDrop)" />
  
  <!-- Document Header Stripe -->
  <path d="M 13,16 C 13,13.79 14.79,12 17,12 L 47,12 C 49.21,12 51,13.79 51,16 L 51,18 L 13,18 Z" fill="#D97706" opacity="0.9" />

  <!-- Profile Avatar Badge -->
  <rect x="17" y="23" width="11" height="11" rx="3" fill="url(#avatarBg)" />
  <circle cx="22.5" cy="26.5" r="2.2" fill="#FFFFFF" />
  <path d="M 18.5,33 C 18.5,30.5 26.5,30.5 26.5,33 Z" fill="#FFFFFF" />

  <!-- Content Lines -->
  <line x1="32" y1="25" x2="45" y2="25" stroke="#334155" strokeWidth="2" strokeLinecap="round" />
  <line x1="32" y1="30" x2="42" y2="30" stroke="#64748B" strokeWidth="1.6" strokeLinecap="round" />
  <line x1="17" y1="39" x2="45" y2="39" stroke="#94A3B8" strokeWidth="1.6" strokeLinecap="round" />
  <line x1="17" y1="44" x2="38" y2="44" stroke="#CBD5E1" strokeWidth="1.6" strokeLinecap="round" />
</svg>
