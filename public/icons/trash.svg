<svg viewBox="0 0 64 64" width="64" height="64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="trashBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#9CA3AF" />
      <stop offset="50%" stopColor="#4B5563" />
      <stop offset="100%" stopColor="#1F2937" />
    </linearGradient>
    <linearGradient id="trashGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" stopOpacity="0.28" />
      <stop offset="40%" stopColor="#FFFFFF" stopOpacity="0.06" />
      <stop offset="100%" stopColor="#000000" stopOpacity="0.14" />
    </linearGradient>
    <linearGradient id="meshBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#FFFFFF" stopOpacity="0.35" />
      <stop offset="100%" stopColor="#FFFFFF" stopOpacity="0.12" />
    </linearGradient>
    <filter id="trashShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" floodColor="#000000" floodOpacity="0.32" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#trashBg)" stroke="rgba(255,255,255,0.22)" strokeWidth="1" filter="url(#trashShadow)" />
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#trashGloss)" />

  <!-- Ideas / Draft Papers Peeking Out -->
  <path d="M 21,22 L 28,14 L 34,21 Z" fill="#60A5FA" opacity="0.95" />
  <path d="M 31,19 L 38,13 L 43,20 Z" fill="#34D399" opacity="0.95" />
  <circle cx="30" cy="18" r="2" fill="#F87171" />

  <!-- Wastebasket Lid -->
  <rect x="16" y="22" width="32" height="3" rx="1.5" fill="#F3F4F6" />
  <path d="M 27,22 L 28,19 L 36,19 L 37,22 Z" fill="#E5E7EB" />

  <!-- Glass/Mesh Body -->
  <path d="M 19,27 L 45,27 L 41,51 C 41,53 39,54 37,54 L 27,54 C 25,54 23,53 23,51 Z" fill="url(#meshBody)" stroke="rgba(255,255,255,0.4)" strokeWidth="1.2" />
  
  <!-- Slotted Wireframe Lines -->
  <line x1="25" y1="30" x2="27" y2="49" stroke="rgba(255,255,255,0.28)" strokeWidth="1.5" />
  <line x1="32" y1="30" x2="32" y2="49" stroke="rgba(255,255,255,0.28)" strokeWidth="1.5" />
  <line x1="39" y1="30" x2="37" y2="49" stroke="rgba(255,255,255,0.28)" strokeWidth="1.5" />
</svg>
