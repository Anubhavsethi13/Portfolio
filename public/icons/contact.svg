<svg viewBox="0 0 64 64" width="64" height="64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="contactBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#2DD4BF" />
      <stop offset="50%" stopColor="#0D9488" />
      <stop offset="100%" stopColor="#115E59" />
    </linearGradient>
    <linearGradient id="contactGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" stopOpacity="0.32" />
      <stop offset="40%" stopColor="#FFFFFF" stopOpacity="0.08" />
      <stop offset="100%" stopColor="#000000" stopOpacity="0.12" />
    </linearGradient>
    <linearGradient id="envBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="100%" stopColor="#E2E8F0" />
    </linearGradient>
    <linearGradient id="envBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#F8FAFC" />
      <stop offset="100%" stopColor="#CBD5E1" />
    </linearGradient>
    <filter id="contactShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" floodColor="#000000" floodOpacity="0.32" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#contactBg)" stroke="rgba(255,255,255,0.25)" strokeWidth="1" filter="url(#contactShadow)" />
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#contactGloss)" />

  <!-- Envelope Back Fold -->
  <rect x="12" y="19" width="40" height="28" rx="4" fill="url(#envBack)" />

  <!-- Letter Sheet -->
  <rect x="16" y="14" width="32" height="15" rx="2" fill="#FFFFFF" />
  <line x1="20" y1="18.5" x2="34" y2="18.5" stroke="#94A3B8" strokeWidth="1.6" strokeLinecap="round" />
  <line x1="20" y1="23" x2="28" y2="23" stroke="#CBD5E1" strokeWidth="1.6" strokeLinecap="round" />

  <!-- Envelope Bottom & Side Flaps -->
  <path d="M 12,47 L 32,32 L 52,47 Z" fill="url(#envBody)" />
  <path d="M 12,19 L 28,33 L 12,47 Z" fill="rgba(226, 232, 240, 0.95)" />
  <path d="M 52,19 L 36,33 L 52,47 Z" fill="rgba(226, 232, 240, 0.95)" />
  <path d="M 12,19 L 32,32 L 52,19 Z" fill="rgba(248, 250, 252, 0.98)" stroke="rgba(0,0,0,0.06)" strokeWidth="0.6" />

  <!-- Wax Seal -->
  <circle cx="32" cy="33.5" r="5" fill="#EF4444" />
  <circle cx="32" cy="33.5" r="3.2" fill="#DC2626" />
  <path d="M 32,31.8 C 32,31.8 30.8,30.8 30,31.5 C 29.2,32.2 30.8,34 32,35.2 C 33.2,34 34.8,32.2 34,31.5 C 33.2,30.8 32,31.8 32,31.8 Z" fill="#FFFFFF" opacity="0.95" />
</svg>
